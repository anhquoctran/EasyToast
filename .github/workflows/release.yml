name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pack & publish
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test with coverage
        shell: pwsh
        run: ./scripts/test-coverage.ps1

      - name: Pack
        run: >
          dotnet pack src/FuzzyToast/FuzzyToast.csproj
          -c Release
          -o artifacts/nuget
          --include-symbols
          -p:SymbolPackageFormat=snupkg

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push artifacts/nuget/*.nupkg
          --api-key ${{ env.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Zip DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/zip/net461
          New-Item -ItemType Directory -Force -Path artifacts/zip/net8.0-windows
          Copy-Item src/FuzzyToast/bin/Release/net461/FuzzyToast.dll, src/FuzzyToast/bin/Release/net461/FuzzyToast.xml -Destination artifacts/zip/net461
          Copy-Item src/FuzzyToast/bin/Release/net8.0-windows/FuzzyToast.dll, src/FuzzyToast/bin/Release/net8.0-windows/FuzzyToast.xml -Destination artifacts/zip/net8.0-windows
          Compress-Archive -Path artifacts/zip/* -DestinationPath artifacts/FuzzyToast.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/FuzzyToast.zip
