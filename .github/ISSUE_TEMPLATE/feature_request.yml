name: Feature request
description: Suggest an enhancement to FuzzyToast
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library does not support well today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the call site you would like to write.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other APIs you considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays on Windows Forms / .NET 8+ (not WPF, MAUI, or WinUI)
          required: true
